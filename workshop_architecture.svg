<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="capa1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="capa2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="capa4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="capa5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1DB954"/>
      <stop offset="100%" style="stop-color:#1ed760"/>
    </linearGradient>
    <linearGradient id="capa6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6a00"/>
      <stop offset="100%" style="stop-color:#ee0979"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg)" rx="20"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold" filter="url(#glow)">🎧 Workshop: Construye tu DJ Agent con Python</text>
  <text x="600" y="76" text-anchor="middle" fill="#a0a0cc" font-size="13">Arquitectura progresiva — De agente básico a aplicación completa</text>

  <!-- Connecting arrows -->
  <line x1="248" y1="260" x2="268" y2="260" stroke="#999" stroke-width="2" opacity="0.5"/>
  <polygon points="266,255 276,260 266,265" fill="#999" opacity="0.5"/>

  <line x1="468" y1="260" x2="488" y2="260" stroke="#999" stroke-width="2" opacity="0.5"/>
  <polygon points="486,255 496,260 486,265" fill="#999" opacity="0.5"/>

  <line x1="688" y1="260" x2="708" y2="260" stroke="#999" stroke-width="2" opacity="0.5"/>
  <polygon points="706,255 716,260 706,265" fill="#999" opacity="0.5"/>

  <line x1="908" y1="260" x2="928" y2="260" stroke="#999" stroke-width="2" opacity="0.5"/>
  <polygon points="926,255 936,260 926,265" fill="#999" opacity="0.5"/>

  <!-- Capa 1 -->
  <rect x="50" y="110" width="200" height="300" rx="16" fill="url(#capa1)" opacity="0.9" filter="url(#shadow)"/>
  <text x="150" y="160" text-anchor="middle" fill="#ffffff" font-size="40">🤖</text>
  <text x="150" y="200" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Paso 1</text>
  <text x="150" y="225" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Agente Básico</text>
  <line x1="90" y1="245" x2="210" y2="245" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="150" y="270" text-anchor="middle" fill="#e0e0ff" font-size="11">Strands SDK</text>
  <text x="150" y="290" text-anchor="middle" fill="#e0e0ff" font-size="11">Amazon Bedrock</text>
  <text x="150" y="310" text-anchor="middle" fill="#e0e0ff" font-size="11">System Prompt</text>
  <text x="150" y="330" text-anchor="middle" fill="#e0e0ff" font-size="11">Conversación</text>
  <rect x="100" y="360" width="100" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="150" y="377" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">FUNDAMENTO</text>

  <!-- Capa 2 -->
  <rect x="270" y="110" width="200" height="300" rx="16" fill="url(#capa2)" opacity="0.9" filter="url(#shadow)"/>
  <text x="370" y="160" text-anchor="middle" fill="#ffffff" font-size="40">🔧</text>
  <text x="370" y="200" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Paso 2</text>
  <text x="370" y="225" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Tools</text>
  <line x1="310" y1="245" x2="430" y2="245" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="370" y="270" text-anchor="middle" fill="#ffe0e8" font-size="11">@tool decorator</text>
  <text x="370" y="290" text-anchor="middle" fill="#ffe0e8" font-size="11">Biblioteca canciones</text>
  <text x="370" y="310" text-anchor="middle" fill="#ffe0e8" font-size="11">Búsqueda género</text>
  <text x="370" y="330" text-anchor="middle" fill="#ffe0e8" font-size="11">Búsqueda mood</text>
  <rect x="320" y="360" width="100" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="370" y="377" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">CAPACIDAD</text>

  <!-- Capa 4 -->
  <rect x="490" y="110" width="200" height="300" rx="16" fill="url(#capa4)" opacity="0.9" filter="url(#shadow)"/>
  <text x="590" y="160" text-anchor="middle" fill="#ffffff" font-size="40">🧠</text>
  <text x="590" y="200" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Paso 3</text>
  <text x="590" y="225" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Memoria</text>
  <line x1="530" y1="245" x2="650" y2="245" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="590" y="270" text-anchor="middle" fill="#e0f4ff" font-size="11">Persistencia</text>
  <text x="590" y="290" text-anchor="middle" fill="#e0f4ff" font-size="11">Historial usuario</text>
  <text x="590" y="310" text-anchor="middle" fill="#e0f4ff" font-size="11">Preferencias</text>
  <text x="590" y="330" text-anchor="middle" fill="#e0f4ff" font-size="11">Sesiones</text>
  <rect x="540" y="360" width="100" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="590" y="377" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">CONTEXTO</text>

  <!-- Capa 5 -->
  <rect x="710" y="110" width="200" height="300" rx="16" fill="url(#capa5)" opacity="0.9" filter="url(#shadow)"/>
  <text x="810" y="160" text-anchor="middle" fill="#ffffff" font-size="40">🎵</text>
  <text x="810" y="200" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Paso 4</text>
  <text x="810" y="225" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Spotify</text>
  <line x1="750" y1="245" x2="870" y2="245" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="810" y="270" text-anchor="middle" fill="#d4ffdf" font-size="11">Spotify Web API</text>
  <text x="810" y="290" text-anchor="middle" fill="#d4ffdf" font-size="11">Reproducción real</text>
  <text x="810" y="310" text-anchor="middle" fill="#d4ffdf" font-size="11">Crear playlists</text>
  <text x="810" y="330" text-anchor="middle" fill="#d4ffdf" font-size="11">Control player</text>
  <rect x="760" y="360" width="100" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="810" y="377" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">INTEGRACIÓN</text>

  <!-- Capa 6 (opcional) -->
  <rect x="930" y="110" width="200" height="300" rx="16" fill="url(#capa6)" opacity="0.75" filter="url(#shadow)" stroke="#ff6a00" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="1030" y="160" text-anchor="middle" fill="#ffffff" font-size="40">🖥️</text>
  <text x="1030" y="200" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Paso 5</text>
  <text x="1030" y="225" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Streamlit UI</text>
  <line x1="970" y1="245" x2="1090" y2="245" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="1030" y="270" text-anchor="middle" fill="#ffe8d4" font-size="11">Chat widget</text>
  <text x="1030" y="290" text-anchor="middle" fill="#ffe8d4" font-size="11">UI interactiva</text>
  <text x="1030" y="310" text-anchor="middle" fill="#ffe8d4" font-size="11">Visualización</text>
  <text x="1030" y="330" text-anchor="middle" fill="#ffe8d4" font-size="11">Deploy ready</text>
  <rect x="980" y="360" width="100" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="1030" y="377" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">OPCIONAL</text>

  <!-- Footer -->
  <text x="600" y="460" text-anchor="middle" fill="#6a6a9a" font-size="12">Strands Agents SDK · Amazon Bedrock · Python · Spotify API · Streamlit</text>
  <text x="600" y="480" text-anchor="middle" fill="#4a4a7a" font-size="11">Cada paso construye sobre el anterior — al final tendrás un DJ Agent funcional 🎶</text>
</svg>